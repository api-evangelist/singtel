actions:
  openapiHarvested: false
  openapiDirectoryCreated: false
  apisYmlCreated: true
  reason: >-
    Identity plus an honest, evidence-backed record of a partner-gated carrier. Seven real,
    named, publicly described APIs are catalogued with their genuine product pages as
    Documentation; no baseURL, no OpenAPI and no auth properties are asserted because none
    are published. The openapi/ directory is deliberately omitted — nothing real was found.
