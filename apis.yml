apis:
- aid: singtel:singverify-number-verify-api
  name: SingVerify Number Verify API
  description: >-
    Network-based verification that the mobile number a user declares is the number of the SIM the
    request is actually coming from, used to replace or reinforce SMS OTP. Singtel documents this as
    the CAMARA-aligned Number Verification capability delivered under the GSMA Open Gateway framework
    and federated with M1 for national coverage. Published as a product page only — no API reference,
    no OpenAPI, no sandbox; access is via enterprise enquiry.
  humanURL: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
  tags:
  - Number Verification
  - CAMARA
  - Identity Verification
  - Authentication
  - Anti-Fraud
  properties:
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify
- aid: singtel:singverify-sim-swap-api
  name: SingVerify SIM Swap API
  description: >-
    Real-time signal indicating whether the SIM bound to a mobile number has been changed recently, so
    that a relying party can block account-takeover attempts that rely on intercepting SMS one-time
    passcodes. Maps to the CAMARA SIM Swap API. Product page only — no API reference, no OpenAPI, no
    sandbox; access is via enterprise enquiry.
  humanURL: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
  tags:
  - SIM Swap
  - CAMARA
  - Anti-Fraud
  - Account Takeover
  properties:
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify
- aid: singtel:singverify-device-location-api
  name: SingVerify Device Location API
  description: >-
    Verifies whether a mobile device is within an expected area or country at the time of a login or
    transaction, using network-derived location rather than handset GPS. Maps to the CAMARA Device
    Location / Location Verification family. Product page only — no API reference, no OpenAPI, no
    sandbox; access is via enterprise enquiry.
  humanURL: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
  tags:
  - Device Location
  - Location Verification
  - CAMARA
  - Anti-Fraud
  properties:
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify
- aid: singtel:singverify-device-roaming-api
  name: SingVerify Device Roaming API
  description: >-
    Reports whether a subscriber's device is currently roaming outside Singapore, used as a risk
    signal in fraud and authentication decisions. Maps to the CAMARA Device Roaming Status / Device
    Status family. Product page only — no API reference, no OpenAPI, no sandbox; access is via
    enterprise enquiry.
  humanURL: https://www.singtel.com/business/products-services/mobility/singverify
  tags:
  - Device Roaming
  - Device Status
  - CAMARA
  - Anti-Fraud
  properties:
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify
  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
- aid: singtel:singverify-scam-sniffer-api
  name: SingVerify Scam Sniffer API
  description: >-
    Detects whether a user is on an active voice call at the moment they attempt a high-value
    transaction, a signal used to interdict authorised-push-payment and social-engineering fraud. This
    is Singtel's counterpart to the CAMARA anti-fraud / Scam Signal work, branded and operated by
    Singtel rather than published as a CAMARA-named product. Product page only — no API reference, no
    OpenAPI, no sandbox; access is via enterprise enquiry.
  humanURL: https://www.singtel.com/business/products-services/mobility/singverify/types-of-api
  tags:
  - Scam Signal
  - Anti-Fraud
  - Call State
  - Payments
  properties:
