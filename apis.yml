name: Singtel
kind: company
description: >-
  Singtel (Singapore Telecommunications Limited) is Singapore's largest mobile network operator and
  the anchor communications group of Southeast Asia, with a regional footprint that includes Optus in
  Australia and associate stakes in Airtel, AIS, Globe and Telkomsel. In the network-API value chain
  Singtel sits on the supply side: it owns the mobile network signals — SIM, line, device, location,
  call state — that the CAMARA specifications turn into callable APIs, and it packages them for
  Singapore as SingVerify, a five-API anti-fraud and identity suite built on the GSMA Open Gateway
  framework. It also operates Paragon, its own 5G/edge/network orchestration platform, which powers
  the Bridge Alliance API Exchange (BAEx) federating network APIs across Bridge Alliance member
  operators, and it is one of the twelve carrier equity partners in Aduna, the Ericsson-led joint
  venture that aggregates operator network APIs into a single global commercial channel. Its API
  posture, however, is partner-gated and sales-led: as of July 2026 there is no first-party developer
  portal (developer., developers., docs. and opengateway. subdomains do not resolve), no published
  OpenAPI, no sandbox, no SDKs and no self-serve signup. Every SingVerify and CPaaS API page on
  singtel.com terminates in an enterprise enquiry form, and the BAEx portal is an explicit login wall
  for approved partners. Developers reach Singtel's network capabilities through aggregators — Aduna
  and its platform partners (Vonage, Sinch, Infobip, Google Cloud), the Bridge Alliance exchange, or
  identity vendors such as IPification — rather than directly from Singtel. Two surfaces do
  exist and are captured here: www.singtel.com publishes a first-party llms.txt family
  (root plus consumer, support and corporate companion files, last updated 2026-06-30)
  that indexes its marketing and support estate for AI systems while naming none of its
  APIs, and Singtel runs a footer-linked vulnerability disclosure programme at
  vdp.singtel.com and on HackerOne. api.singtel.com is a live Apigee gateway behind
  Imperva that answers every unrouted path with an Apigee fault envelope — a real gateway
  with nothing publicly bound to it.
