  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/mobility-solutions/singtel-cpaas
- aid: singtel:singtel-cpaas-voice-api
  name: Singtel CPaaS Voice API
  description: >-
    Programmable voice / VoIP calling embedded into business applications, sold as part of the Singtel
    CPaaS portfolio. As with the SMS API, the public page is a product description with an enquiry
    form — no endpoint, no auth scheme, no API reference and no OpenAPI are published.
  humanURL: https://www.singtel.com/business/products-services/mobility/mobility-solutions/singtel-cpaas/voice-api
