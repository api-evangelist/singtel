  - type: Documentation
    url: https://www.singtel.com/business/products-services/mobility/singverify
- aid: singtel:singtel-cpaas-sms-api
  name: Singtel CPaaS SMS API
  description: >-
    Application-to-person SMS sending and receiving for business applications, sold as part of the
    Singtel CPaaS portfolio. The public page describes the capability and benefits but publishes no
    endpoint, no authentication scheme, no API reference and no OpenAPI; the only call to action is a
    Singtel CPaaS enquiry form.
  humanURL: https://www.singtel.com/business/products-services/mobility/mobility-solutions/singtel-cpaas/sms-api
  tags:
  - SMS
