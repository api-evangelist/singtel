source: live probes of every Singtel host in apis.yml plus the API gateway host
note: >-
  No /.well-known/ document of any kind is published on any Singtel host. This is a
  recorded negative, not a gap in the probe: every path below was fetched on 2026-07-25.
  Two findings are worth keeping. First, api.singtel.com is a live Apigee API gateway —
  every unrouted path returns the Apigee fault envelope
  {"fault":{"faultstring":"Unable to identify proxy for host: secure and url: ..."}}
  rather than a web-server 404, which confirms a real gateway is running behind the
  Imperva edge but that no proxy is bound to any public discovery path. Second,
  www.singtel.com serves a first-party llms.txt surface (see llms/) even though it serves
  no /.well-known/ documents at all.
