note: >-
  Singtel publishes no API lifecycle surface: no versioning policy, no deprecation or
  sunset policy, no API status page, no SLA document and no changelog for SingVerify,
  Singtel CPaaS or Paragon. What it does publish is operator-grade *service* lifecycle
  communication aimed at subscribers and enterprise account holders — scheduled
  maintenance notices, a fault-reporting and incident-monitoring page, and a 3G network
  closure programme with its own acknowledgement forms. Those are recorded here because
  they are the closest real thing to lifecycle transparency, but none of them is an API
  artifact and none is wired as a StatusPage or Deprecation pointer.
