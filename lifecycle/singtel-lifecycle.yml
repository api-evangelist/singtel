status_page_note: >-
  status.singtel.com is NXDOMAIN. No status.io / Statuspage.io / Atlassian-hosted status
  surface exists for Singtel APIs or services. Third-party outage trackers
  (outage.report, downdetector-style sites) are the only public availability signal —
  they recorded a roughly nine-hour Singtel mobile network outage on 2026-03-17.
