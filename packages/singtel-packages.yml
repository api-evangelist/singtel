note: >-
  No first-party Singtel client library exists on any public registry, and there is no
  Singtel GitHub organization to host one (api.github.com/orgs/singtel, /singtel-group and
  /SingtelParagon all return 404). This is consistent with the rest of Singtel's posture:
  the SingVerify, CPaaS and Paragon APIs are sold through enterprise engagement, so
  integration code is delivered under contract rather than published. What the registries
  do contain is a small set of third-party and squatted artifacts, recorded below so a
  future round does not mistake any of them for an official SDK.
